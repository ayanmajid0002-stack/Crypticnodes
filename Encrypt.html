<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crypticNode | Encrypt Tool · NEO DARK</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'JetBrains Mono', monospace;
      background: #03050b;
      color: #eef2ff;
      overflow-x: hidden;
    }

    .cyber-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(125deg, #03050b 0%, #0a0f1f 50%, #010108 100%);
      z-index: -2;
    }

    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: repeating-linear-gradient(0deg, rgba(0, 255, 200, 0.05) 0px, rgba(0, 255, 200, 0.05) 1px, transparent 1px, transparent 3px), repeating-linear-gradient(90deg, rgba(0, 255, 200, 0.05) 0px, rgba(0, 255, 200, 0.05) 1px, transparent 1px, transparent 3px);
      pointer-events: none;
      z-index: -1;
    }

    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0, 255, 200, 0.02) 0px, rgba(0, 255, 200, 0.02) 2px, transparent 2px, transparent 6px);
      pointer-events: none;
      z-index: 999;
    }

    /* ========== NAVBAR WITH VISIBLE BOTTOM RUNNING LINE ========== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 6%;
      background: rgba(2, 5, 18, 0.9);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 10px rgba(0, 255, 200, 0.1), inset 0 1px 0 rgba(0, 255, 200, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      position: relative;
      overflow: hidden;
      border-bottom: 2px solid rgba(0, 255, 200, 0.3);
    }

    /* Navbar ke NICHE line - SUPER BRIGHT Left se Right */
    .navbar::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: -100%;
      width: 70%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00ffff, #0ff, #2affd0, #00ffff, #0ff, transparent);
      animation: borderRunLeftToRight 2s linear infinite;
      filter: drop-shadow(0 0 5px #0ff);
      z-index: 101;
    }

    /* Extra glowing line for navbar */
    .navbar::before {
      content: '';
      position: absolute;
      bottom: -2px;
      left: -100%;
      width: 70%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #ffffff, #7effe0, #ffffff, transparent);
      animation: borderRunLeftToRight 2s linear infinite;
      filter: blur(2px);
      z-index: 100;
    }

    @keyframes borderRunLeftToRight {
      0% { left: -100%; }
      100% { left: 150%; }
    }

    /* Hover effect - speed increase */
    .navbar:hover::after {
      animation-duration: 1.2s;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(145deg, #b5ffff, #2affd0, #00a6ff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -1px;
      text-shadow: 0 0 4px #00ffcc80;
      transition: all 0.2s ease;
    }

    .logo:hover {
      transform: scale(1.02);
      filter: drop-shadow(0 0 6px #0ff);
    }

    .logo span {
      font-weight: 700;
      background: linear-gradient(135deg, #7efff0, #00ddff);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .back-link {
      color: #0ff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: 0.2s ease;
      padding: 0.5rem 1rem;
      border-radius: 60px;
      border: 1px solid rgba(0, 255, 200, 0.3);
    }

    .back-link:hover {
      color: #fff;
      text-shadow: 0 0 5px #0ff;
      border-color: #0ff;
      box-shadow: 0 0 8px rgba(0, 255, 200, 0.3);
      transform: translateX(-3px);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
      z-index: 5;
    }

    .tool-header {
      padding: 2rem 0 1rem 0;
      animation: smoothFadeUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    @keyframes smoothFadeUp {
      0% {
        opacity: 0;
        transform: translateY(25px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tool-header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #7effe0, #2a9dff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      filter: drop-shadow(0 0 6px rgba(0,255,200,0.3));
    }

    .tool-header h1 i {
      color: #0ff;
      text-shadow: 0 0 3px #0ff;
    }

    .tool-header p {
      color: #9bc0f0;
      margin-top: 0.5rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #0ff, #0ff, transparent);
      margin: 1.5rem 0;
    }

    .tool-card {
      background: rgba(6, 10, 22, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 255, 210, 0.4);
      border-radius: 28px;
      padding: 2rem;
      margin: 1rem 0 2rem 0;
      box-shadow: 0 20px 35px -8px black;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeUpCard 0.6s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
    }

    @keyframes fadeUpCard {
      0% {
        opacity: 0;
        transform: translateY(15px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tool-card:hover {
      border-color: #0ff;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.15);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #eef2ff;
      font-size: 0.9rem;
    }

    .form-group label i {
      color: #0ff;
      margin-right: 0.5rem;
      text-shadow: 0 0 3px #0ff;
    }

    .form-group textarea {
      width: 100%;
      padding: 1rem;
      background: #01030f;
      border: 1px solid #2c799b;
      border-radius: 16px;
      font-size: 0.95rem;
      font-family: 'Inter', monospace;
      resize: vertical;
      outline: none;
      color: #eaf6ff;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2);
    }

    .form-group textarea:focus {
      border-color: #0ff;
      box-shadow: 0 0 10px #0ff;
      transform: scale(1.01);
    }

    /* Password wrapper with eye icon */
    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .password-wrapper input {
      width: 100%;
      padding: 0.85rem 2.8rem 0.85rem 1rem;
      background: #01030f;
      border: 1px solid #2c799b;
      border-radius: 16px;
      font-size: 0.95rem;
      font-family: 'Inter', monospace;
      outline: none;
      color: #eaf6ff;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2);
    }

    .password-wrapper input:focus {
      border-color: #0ff;
      box-shadow: 0 0 10px #0ff;
      transform: scale(1.01);
    }

    /* custom numeric validation style */
    .password-wrapper input.invalid-key {
      border-color: #ff3366;
      box-shadow: 0 0 8px rgba(255, 51, 102, 0.5);
      animation: shake 0.2s ease-in-out 0s 2;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #0ff;
      font-size: 1.1rem;
      background: transparent;
      border: none;
      transition: all 0.2s ease;
      z-index: 2;
    }

    .toggle-password:hover {
      color: #fff;
      text-shadow: 0 0 6px #0ff;
      transform: translateY(-50%) scale(1.1);
    }

    .key-hint {
      font-size: 0.75rem;
      color: #7ca5dd;
      margin-top: 0.35rem;
    }

    .key-hint i {
      color: #0ff;
      margin-right: 0.3rem;
    }

    .encrypt-btn {
      background: linear-gradient(95deg, #0a1128, #020617);
      color: white;
      padding: 0.9rem 2rem;
      border: 1px solid #0ff;
      border-radius: 60px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2);
    }

    .encrypt-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      filter: grayscale(0.1);
      transform: none;
    }

    .encrypt-btn:hover:not(:disabled) {
      background: #142845;
      box-shadow: 0 0 12px #0ff;
      border-color: #b5ffff;
      transform: translateY(-3px) scale(1.01);
    }

    .result-box {
      background: rgba(2, 5, 18, 0.5);
      border: 1px solid rgba(0, 255, 200, 0.3);
      border-radius: 20px;
      padding: 1.25rem;
      margin-top: 1.5rem;
      transition: all 0.3s ease;
    }

    .result-box:hover {
      border-color: #0ff;
      box-shadow: 0 0 10px rgba(0, 255, 200, 0.1);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .result-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #9bc0f0;
    }

    .result-label i {
      color: #0ff;
      margin-right: 0.5rem;
    }

    .copy-btn {
      background: rgba(0, 255, 200, 0.1);
      border: 1px solid rgba(0, 255, 200, 0.4);
      border-radius: 40px;
      padding: 0.4rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #0ff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.2);
    }

    .copy-btn:hover {
      background: rgba(0, 255, 200, 0.2);
      border-color: #0ff;
      transform: scale(1.02);
      box-shadow: 0 0 8px rgba(0, 255, 200, 0.3);
    }

    .copy-btn.copied {
      background: #0ff;
      color: #01030f;
      border-color: #fff;
    }

    .result-content {
      background: #01030f;
      border: 1px solid #2c799b;
      border-radius: 16px;
      padding: 1rem;
      font-family: 'Inter', monospace;
      font-size: 0.9rem;
      word-break: break-all;
      color: #eaf6ff;
      min-height: 80px;
      transition: all 0.2s ease;
    }

    /* ========== FOOTER WITH VISIBLE TOP RUNNING LINE ========== */
    footer {
      text-align: center;
      padding: 2rem;
      color: #4a7a9f;
      border-top: 2px solid rgba(0, 255, 200, 0.3);
      background: rgba(1, 3, 12, 0.8);
      backdrop-filter: blur(12px);
      font-size: 0.8rem;
      position: relative;
      z-index: 5;
      transition: all 0.2s;
      overflow: hidden;
    }

    /* Footer ke UPPER line - SUPER BRIGHT Left se Right */
    footer::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -100%;
      width: 70%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00ffff, #0ff, #2affd0, #00ffff, #0ff, transparent);
      animation: borderRunLeftToRightFooter 2s linear infinite;
      filter: drop-shadow(0 0 5px #0ff);
      z-index: 6;
    }

    /* Extra glowing line for footer */
    footer::after {
      content: '';
      position: absolute;
      top: -2px;
      left: -100%;
      width: 70%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #ffffff, #7effe0, #ffffff, transparent);
      animation: borderRunLeftToRightFooter 2s linear infinite;
      filter: blur(2px);
      z-index: 5;
    }

    @keyframes borderRunLeftToRightFooter {
      0% { left: -100%; }
      100% { left: 150%; }
    }

    /* Hover effect - speed increase */
    footer:hover::before {
      animation-duration: 1.2s;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(0, 255, 200, 0.9);
      color: #01030f;
      padding: 0.8rem 1.5rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      z-index: 1000;
      animation: toastSlide 0.3s ease forwards;
      box-shadow: 0 0 15px #0ff;
    }

    @keyframes toastSlide {
      0% {
        opacity: 0;
        transform: translateX(50px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }
      .tool-header h1 {
        font-size: 1.5rem;
      }
      .container {
        padding: 0 1rem;
      }
      .tool-card {
        padding: 1.25rem;
      }
      .result-header {
        flex-direction: column;
        gap: 0.75rem;
        align-items: stretch;
      }
      .copy-btn {
        justify-content: center;
      }
      .toast {
        bottom: 20px;
        right: 20px;
        left: 20px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<div class="cyber-bg"></div>
<div class="grid-overlay"></div>
<div class="scanline"></div>

<nav class="navbar">
  <div class="logo">Cryptic<span>Node</span></div>
  <a href="/dashboard" class="back-link"><i class="fas fa-chevron-left"></i> Back to Dashboard</a>
</nav>

<main class="container">
  <div class="tool-header">
    <h1><i class="fas fa-lock"></i> Encrypt Tool</h1>
    <p>Convert your plain text into encrypted format</p>
  </div>

  <div class="divider"></div>

  <div class="tool-card">
    <!-- Client-side encryption form: no actual POST action to server, uses javascript encryption -->
    <div>
      <div class="form-group">
        <label><i class="fas fa-font"></i> Text to Encrypt</label>
        <textarea rows="5" id="plainTextArea" placeholder="Enter your secret message here..."></textarea>
      </div>

      <div class="form-group">
        <label><i class="fas fa-shield-alt"></i> Password (Numeric Key only)</label>
        <div class="password-wrapper">
          <input type="password" name="shiftkey" id="passwordField" maxlength="6" placeholder="Enter numeric password (digits only)" autocomplete="off">
          <i class="fas fa-eye-slash toggle-password" id="togglePassword"></i>
        </div>
        <div class="key-hint"><i class="fas fa-info-circle"></i> Only digits allowed (0-9). Keep this key safe — you'll need it to decrypt!</div>
      </div>

      <button id="encryptBtn" class="encrypt-btn">
        <i class="fas fa-terminal"></i> Encrypt Message
      </button>
    </div>

    <div class="result-box">
      <div class="result-header">
        <div class="result-label">
          <i class="fas fa-network-wired"></i> Encrypted Output (Base64 Cipher)
        </div>
        <button class="copy-btn" id="copyResultBtn">
          <i class="fas fa-copy"></i> Copy
        </button>
      </div>
      <div class="result-content" id="resultContent">
        Your encrypted text will appear here
      </div>
    </div>
  </div>
</main>

<footer>
  <p>© 2026 crypticNode — Secure Encryption Tool</p>
</footer>

<script>
  // DOM elements
  const passwordInput = document.getElementById('passwordField');
  const encryptBtn = document.getElementById('encryptBtn');
  const plainTextArea = document.getElementById('plainTextArea');
  const resultDiv = document.getElementById('resultContent');

  // Helper: show toast
  function showToast(message, isError = false) {
    const existingToast = document.querySelector('.toast');
    if (existingToast) existingToast.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast';
    if (isError) {
      toast.style.background = 'rgba(255, 68, 68, 0.95)';
      toast.style.color = '#fff';
      toast.style.boxShadow = '0 0 15px #ff3366';
    } else {
      toast.style.background = 'rgba(0, 255, 200, 0.9)';
      toast.style.color = '#01030f';
    }
    toast.innerHTML = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
      if (toast) {
        toast.style.animation = 'toastSlide 0.3s ease reverse forwards';
        setTimeout(() => toast.remove(), 300);
      }
    }, 2800);
  }

  // ----- NUMERIC VALIDATION (only digits) for shiftkey field while preserving type="password" -----
  // This ensures that only numeric characters can be entered into the password field.
  // We intercept input, keypress, and also handle paste to filter non-digit chars.
  function validateAndFilterNumeric(event) {
    let inputElement = passwordInput;
    let rawValue = inputElement.value;
    
    // For input events (including paste)
    setTimeout(() => {
      let currentVal = inputElement.value;
      // Remove any non-digit characters
      let filtered = currentVal.replace(/[^0-9]/g, '');
      if (currentVal !== filtered) {
        inputElement.value = filtered;
        // Add invalid class for visual feedback
        inputElement.classList.add('invalid-key');
        showToast('Only numeric digits (0-9) allowed for password key!', true);
        setTimeout(() => {
          if (inputElement) inputElement.classList.remove('invalid-key');
        }, 600);
      } else {
        inputElement.classList.remove('invalid-key');
      }
      // Enforce maxlength 6 manually
      if (inputElement.value.length > 6) {
        inputElement.value = inputElement.value.slice(0, 6);
      }
    }, 0);
  }
  
  // Intercept keypress to block non-numeric characters before they appear
  function onKeyPressNumeric(e) {
    const charCode = e.which ? e.which : e.keyCode;
    const keyChar = String.fromCharCode(charCode);
    // Allow backspace, delete, arrow keys, tab, etc. (control keys)
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (charCode === 8 || charCode === 46 || charCode === 37 || charCode === 39 || charCode === 9) return;
    // Allow digits only
    if (!/[0-9]/.test(keyChar)) {
      e.preventDefault();
      showToast('Only numeric digits allowed!', true);
      passwordInput.classList.add('invalid-key');
      setTimeout(() => {
        if (passwordInput) passwordInput.classList.remove('invalid-key');
      }, 500);
      return false;
    }
    // enforce max length manually
    const currentVal = passwordInput.value;
    if (currentVal.length >= 6 && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      showToast('Maximum key length is 6 digits', true);
      return false;
    }
    return true;
  }
  
  function onPasteNumeric(e) {
    e.preventDefault();
    let pastedText = (e.clipboardData || window.clipboardData).getData('text');
    let digitsOnly = pastedText.replace(/[^0-9]/g, '');
    if (digitsOnly.length > 0) {
      let newVal = (passwordInput.value + digitsOnly).slice(0, 6);
      passwordInput.value = newVal;
      // trigger validation
      const evt = new Event('input', { bubbles: true });
      passwordInput.dispatchEvent(evt);
    } else {
      showToast('Pasted text contains no digits!', true);
    }
  }
  
  // Attach numeric validation events to password field (type=password stays)
  passwordInput.addEventListener('input', validateAndFilterNumeric);
  passwordInput.addEventListener('keypress', onKeyPressNumeric);
  passwordInput.addEventListener('paste', onPasteNumeric);
  // also add an extra blur cleanup
  passwordInput.addEventListener('blur', function() {
    let val = this.value;
    let filtered = val.replace(/[^0-9]/g, '');
    if (filtered !== val) this.value = filtered;
    if (this.value.length > 6) this.value = this.value.slice(0,6);
  });
  
  // ----- Client Side Encryption (XOR + base64 for secure representation) -----
  // Because server-side action not present, we create an elegant symmetric cipher using numeric key.
  // Actually the logic: convert each character's char code XOR with derived key bytes (key repeated)
  // then produce base64 string. The user must remember numeric key for decryption (future decrypt page).
  function encryptWithNumericKey(plainText, numericKeyStr) {
    if (!plainText || plainText.trim() === "") {
      throw new Error("No text provided for encryption.");
    }
    if (!numericKeyStr || numericKeyStr.length === 0) {
      throw new Error("Numeric encryption key is required.");
    }
    // convert numeric string to array of digits (0-9) and then use as shift values for XOR
    const keyDigits = numericKeyStr.split('').map(ch => parseInt(ch, 10));
    if (keyDigits.some(isNaN)) {
      throw new Error("Invalid key format.");
    }
    let resultBytes = [];
    for (let i = 0; i < plainText.length; i++) {
      const charCode = plainText.charCodeAt(i);
      const keyByte = keyDigits[i % keyDigits.length];
      // XOR operation between char code and key digit (0-9)
      let encryptedCode = charCode ^ keyByte;
      resultBytes.push(encryptedCode);
    }
    // convert byte array to binary string then base64 for safe transport
    const uint8Array = new Uint8Array(resultBytes);
    let binaryString = '';
    for (let i = 0; i < uint8Array.length; i++) {
      binaryString += String.fromCharCode(uint8Array[i]);
    }
    // base64 encode using btoa for unicode safety: but because bytes are 0-255 we can use btoa.
    // For full unicode compat, but XOR may produce extended ascii, still safe within Latin1 range. btoa works on binary string.
    let base64 = btoa(binaryString);
    // Add a small header 'cryptic:' and keyHint length but hidden format: we return clean base64
    return base64;
  }
  
  // Encryption handler
  async function performEncryption() {
    const plainText = plainTextArea.value;
    const rawKey = passwordInput.value;
    // Validate plain text
    if (!plainText || plainText.trim() === "") {
      showToast("⚠️ Please enter text to encrypt!", true);
      resultDiv.innerText = "Error: No text provided.";
      return;
    }
    // Validate key: must be numeric and non-empty (already filtered but check)
    if (!rawKey || rawKey.length === 0) {
      showToast("❌ Please enter a numeric password key (digits only).", true);
      resultDiv.innerText = "Error: Password key is required.";
      return;
    }
    // Additional numeric check (if somehow non-digit slip, but filter ensures it)
    if (!/^\d+$/.test(rawKey)) {
      showToast("❌ Key must contain only digits (0-9).", true);
      resultDiv.innerText = "Error: Invalid key format.";
      return;
    }
    try {
      // Disable button during operation
      encryptBtn.disabled = true;
      encryptBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Encrypting...';
      // slight delay for UI feedback
      await new Promise(r => setTimeout(r, 50));
      const encryptedBase64 = encryptWithNumericKey(plainText, rawKey);
      resultDiv.innerText = encryptedBase64;
      showToast("✓ Encryption successful! Copy your ciphertext.");
    } catch (err) {
      console.error(err);
      resultDiv.innerText = "Encryption failed: " + err.message;
      showToast("❌ Encryption error: " + err.message, true);
    } finally {
      encryptBtn.disabled = false;
      encryptBtn.innerHTML = '<i class="fas fa-terminal"></i> Encrypt Message';
    }
  }
  
  encryptBtn.addEventListener('click', performEncryption);
  
  // ========== Copy result logic ==========
  const copyResultBtn = document.getElementById('copyResultBtn');
  copyResultBtn.addEventListener('click', async () => {
    const textToCopy = resultDiv.innerText;
    if (!textToCopy || textToCopy === "Your encrypted text will appear here" || textToCopy.startsWith("Error:") || textToCopy.startsWith("Encryption failed")) {
      showToast("⚠️ No valid encrypted content to copy. Encrypt something first.", true);
      return;
    }
    try {
      await navigator.clipboard.writeText(textToCopy);
      copyResultBtn.classList.add('copied');
      copyResultBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
      showToast("📋 Encrypted text copied to clipboard!");
      setTimeout(() => {
        copyResultBtn.classList.remove('copied');
        copyResultBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
      }, 2000);
    } catch (err) {
      showToast("❌ Failed to copy.", true);
    }
  });
  
  // Password visibility toggle (remains functional, doesn't affect numeric validation)
  const togglePassword = document.getElementById('togglePassword');
  togglePassword.addEventListener('click', function() {
    if (passwordField.type === 'password') {
      passwordField.type = 'text';
      togglePassword.classList.remove('fa-eye-slash');
      togglePassword.classList.add('fa-eye');
    } else {
      passwordField.type = 'password';
      togglePassword.classList.remove('fa-eye');
      togglePassword.classList.add('fa-eye-slash');
    }
    togglePassword.style.transform = 'translateY(-50%) scale(1.2)';
    setTimeout(() => {
      if (togglePassword) togglePassword.style.transform = '';
    }, 150);
  });
  
  // Ensure initial placeholder without any auto values
  // For an elegant start, result default text is proper
  // Also we add a small initial effect for demo
  console.log("crypticNode ready | Numeric password only, type=password preserved");
</script>
